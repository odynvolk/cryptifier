version: "3.9"

services:
  cryptifier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cryptifier
    restart: unless-stopped
    # Shutdown only stops between cycles, and a worst-case cycle burns ~30 s of
    # API timeouts. Compose's 10 s default would SIGKILL that mid-cycle.
    # Not honoured by a bare `docker run` — that needs `docker stop -t 45`.
    stop_grace_period: 45s
    environment:
      - TZ=Europe/Berlin
    env_file:
      - .env
    volumes:
      # Mount .env file for live updates without rebuilding
      - ./.env:/app/.env:ro
    # Optional: Set resource limits
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
