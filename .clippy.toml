# Clippy linting configuration

# Maximum function length (lines)
too-many-lines-threshold = 100

# Maximum cognitive complexity
cognitive-complexity-threshold = 15

allow-unwrap-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# Disallowed methods
# NOTE: std::env::var is intentionally NOT disallowed here because
# src/config.rs legitimately reads environment variables through it.
disallowed-methods = [
    { path = "std::env::set_var", reason = "Use dotenvy to load .env instead" },
]
